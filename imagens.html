<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="grids.css">
    <style>

        .body {
            color: rgb(73, 73, 73);
        }

        .row{
           margin-bottom: 10px;
            
        }
        .border {
            border: 1px solid black;
            }

        .coluna-imagem2 {
            height: 100px;

        }

          .coluna-imagem3 {
            padding: 20px;
            border-radius: 5px;
            gap: 5px;

        }
        .bordaimagem {
            border: 3px solid black;
            border-radius: 5px;
            


        }

    </style>
</head>
<body>
    <div class="container">


     <div class="row">
        <div class="col-12 border"> <h1>imagens</h1> </div>
     </div>





     <div class="row gap-1">
        
        <div class="col-4 border bordaimagem"><img src="imagens/clashroyale.jpg" class="imagen" alt=""></div>

        <div class="col-8 border"><h2>conteudo</h2></div>

     </div>

     <div class="row gap-1">
        
        <div class="col-4 border coluna-imagem2 bordaimagem"><img src="imagens/clashroyale.jpg" class="img-fill" alt=""></div>

        <div class="col-8 border"><h2>conteudo</h2></div>

     </div>

    <div class="row gap-1">
        
        <div class="col-4 border .coluna-imagem3 bordaimagem"><img src="imagens/clashroyale.jpg" class="img-fill" alt=""></div>

        <div class="col-8 border"><h2>conteudo</h2></div>

     </div>





    </div>
    
</body>
</html>
