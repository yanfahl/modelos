<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 1</title>
    <link rel="stylesheet" href="grids.css">
     <style>
        .topo{
            border: 1px solid black;
            margin-bottom: 5px;
            height: 80px;
        }

        .menu1{
            border: 1px solid black;
            height: 30px;
            margin-bottom: 5px;
        }

        .menu{
            border: 1px solid black;
            height: 400px;
            margin-bottom: 5px;
        }

        .conteudo{
            border: 1px solid black;
            height: 400px;
        }

        .rodape{
            border: 1px solid black;
        }

     </style>
</head>
<body>

    <div class="container">

        <div class="row">
            <div class="col-12 topo">
                <h1>Topo</h1>
            </div>
        </div>

        <div class="row">
            <div class="col-12 menu1">
                <h1>Menu</h1>
            </div>
        </div>


        <div class="row gap-1">
            <div class="col-6 menu">Menu</div>
            <div class="col-6 conteudo">Conteúdo</div>
        </div>

        <div class="row">
            <div class="col-12 rodape">Rodapé</div>
        </div>

    </div>
    
</body>
</html>
